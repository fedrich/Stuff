<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FaceFree</title>
  <meta name="description" content="Editor di volti gratuito: età, genere, sorriso, barba, capelli, trucco, occhiali, sfondi, filtri e morph. Tutto nel browser, nessun upload.">
  <meta name="theme-color" content="#0e1014">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>FaceFree</span></div>
    <div class="actions">
      <label class="btn" for="file">Carica foto</label>
      <input id="file" type="file" accept="image/*" hidden>
      <button class="btn" id="camBtn" type="button">Fotocamera</button>
      <button class="btn primary" id="downloadBtn" type="button" disabled>Scarica</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div class="empty" id="empty">
        <img src="icon.svg" alt="" width="72" height="72">
        <h1>Trasforma il tuo volto, gratis</h1>
        <p>Carica una foto con il viso ben visibile, trascinala qui o incollala (Ctrl+V).<br>
          L'elaborazione avviene interamente nel tuo browser: nessuna foto viene caricata su server.</p>
        <div class="row">
          <label class="btn primary big" for="file">Scegli una foto</label>
          <button class="btn big" id="camBtn2" type="button">Usa la fotocamera</button>
        </div>
      </div>

      <div class="viewer" id="viewer" hidden>
        <div class="canvas-wrap" id="wrap">
          <canvas id="out"></canvas>
          <canvas id="orig" class="orig" hidden></canvas>
          <div class="split-handle" id="handle" hidden><span></span></div>
        </div>
      </div>

      <div class="stage-tools" id="tools" hidden>
        <button class="btn small" id="holdBtn" type="button">Tieni premuto per l'originale</button>
        <button class="btn small" id="splitBtn" type="button" aria-pressed="false">Prima / Dopo</button>
        <button class="btn small" id="resetBtn" type="button">Reimposta tutto</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <aside class="panel" id="panel" aria-label="Strumenti">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="tab-body" id="tabBody"></div>
    </aside>
  </main>

  <dialog id="camDialog">
    <video id="video" autoplay playsinline muted></video>
    <div class="row">
      <button class="btn primary" id="snapBtn" type="button">Scatta</button>
      <button class="btn" id="camClose" type="button">Chiudi</button>
    </div>
  </dialog>

  <input id="file2" type="file" accept="image/*" hidden>
  <script type="module" src="js/main.js"></script>
</body>
</html>
