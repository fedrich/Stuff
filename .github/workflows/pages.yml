name: Pubblica le app su GitHub Pages

on:
  push:
    branches: [main]
    paths: ['studio/**', 'faceapp/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Volto Studio alla radice del sito, la prima versione (FaceFree) in /classic/
      - name: Prepara il sito
        run: |
          mkdir -p _site/classic
          rsync -a --exclude tests --exclude docs studio/ _site/
          rsync -a faceapp/ _site/classic/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
