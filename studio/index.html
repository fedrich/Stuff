<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Volto Studio</title>
  <meta name="description" content="Editor fotografico del volto: impressioni, pelle e tratti regolabili con gradualità. Tutto sul dispositivo, nessun upload.">
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <button class="icon-btn" id="newBtn" type="button" aria-label="Nuova foto" title="Nuova foto">
      <svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <div class="brand">Volto <span>Studio</span></div>
    <div class="bar-actions">
      <button class="icon-btn" id="undoBtn" type="button" aria-label="Annulla" title="Annulla" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-2"/></svg>
      </button>
      <button class="icon-btn" id="redoBtn" type="button" aria-label="Ripeti" title="Ripeti" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h2"/></svg>
      </button>
      <button class="pill primary" id="exportBtn" type="button" disabled>Esporta</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div class="empty" id="empty">
        <img src="icon.svg" alt="" width="64" height="64">
        <h1>Il tuo volto, migliorato con misura</h1>
        <p>Carica un ritratto frontale e ben illuminato. Le modifiche sono graduali e localizzate, e restano sempre riconoscibili.
          Tutto viene elaborato sul tuo dispositivo: la foto non lascia il telefono.</p>
        <div class="row">
          <label class="pill primary big" for="file">Scegli una foto</label>
          <button class="pill big" id="camBtn" type="button">Scatta</button>
        </div>
        <p class="status" id="loadStatus" role="status" aria-live="polite"></p>
      </div>

      <div class="viewport" id="viewport" hidden>
        <div class="zoom-layer" id="zoomLayer">
          <canvas id="glCanvas"></canvas>
          <canvas id="origCanvas" class="orig" hidden></canvas>
          <div class="split-line" id="splitLine" hidden></div>
        </div>
        <div class="badge" id="beforeBadge" hidden>Originale</div>
        <div class="stage-tools" id="stageTools">
          <button class="float-btn" id="holdBtn" type="button" title="Tieni premuto per vedere l'originale" aria-label="Tieni premuto per vedere l'originale">
            <svg viewBox="0 0 24 24"><path d="M12 4v16"/><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 9h2M7 12h2"/></svg><span>Prima</span>
          </button>
          <button class="float-btn" id="splitBtn" type="button" aria-pressed="false" title="Confronto prima/dopo con divisore" aria-label="Confronto prima/dopo con divisore">
            <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="m8 9-3 3 3 3M16 9l3 3-3 3"/></svg><span>Dividi</span>
          </button>
          <button class="float-btn" id="zoomBtn" type="button" aria-pressed="false" title="Zoom sul volto" aria-label="Zoom sul volto">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5M11 8v6M8 11h6"/></svg><span>Volto</span>
          </button>
          <button class="float-btn" id="resetAllBtn" type="button" title="Torna alla foto originale" aria-label="Torna alla foto originale">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg><span>Azzera</span>
          </button>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="progress" id="progress" hidden><div class="spinner"></div><span id="progressText">Elaborazione…</span></div>
    </section>

    <section class="sheet" id="sheet" aria-label="Strumenti">
      <nav class="cats" role="tablist" id="cats">
        <button role="tab" type="button" data-cat="impressions" aria-selected="true">Impressioni</button>
        <button role="tab" type="button" data-cat="skin" aria-selected="false">Pelle</button>
        <button role="tab" type="button" data-cat="traits" aria-selected="false">Tratti</button>
      </nav>
      <div class="tool-strip" id="toolStrip"></div>
      <div class="tool-panel" id="toolPanel"></div>
    </section>
  </main>

  <input id="file" type="file" accept="image/*" hidden>
  <dialog id="camDialog">
    <video id="video" autoplay playsinline muted></video>
    <div class="row">
      <button class="pill primary" id="snapBtn" type="button">Scatta</button>
      <button class="pill" id="camClose" type="button">Chiudi</button>
    </div>
  </dialog>
  <script type="module" src="src/app/app.js"></script>
</body>
</html>
